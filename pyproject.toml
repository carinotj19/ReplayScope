[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "replayscope"
version = "1.0.0"
description = "Simulation-independent benchmark ingestion and analytics with Flask"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.1,<4",
  "Flask-SQLAlchemy>=3.1,<4",
  "Flask-Migrate>=4.1,<5",
  "Flask-Limiter>=4.1,<5",
  "redis>=5,<7",
  "rq>=2,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "psycopg[binary]>=3.2,<4"]
prod = ["psycopg[binary]>=3.2,<4", "gunicorn>=22,<24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
replayscope = ["templates/*.html", "static/*.css", "static/*.js", "static/*.svg", "openapi.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
