name: Python CI
on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q src tests migrations
      - run: python -m pytest -q

  infrastructure:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: replayscope
          POSTGRES_USER: replayscope
          POSTGRES_PASSWORD: local_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U replayscope -d replayscope"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://replayscope:local_dev_only@localhost:5432/replayscope
      TEST_REDIS_URL: redis://localhost:6379/15
      RUN_REDIS_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_infrastructure.py
